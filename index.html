<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub</title>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Top Bar */
        header {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            border-bottom: 1px solid #161616;
            z-index: 100;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            flex: 1;
            max-width: 520px;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 20px;
            background-color: #0c0c0c;
            border: 1px solid #222222;
            border-radius: 24px 0 0 24px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #3ea6ff;
        }

        .search-box button {
            padding: 10px 22px;
            background-color: #1a1a1a;
            border: 1px solid #222222;
            border-left: none;
            border-radius: 0 24px 24px 0;
            color: white;
            cursor: pointer;
        }

        .dashboard-nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link {
            text-decoration: none;
            color: #d1d1d1;
            background-color: #121212;
            border: 1px solid #242424;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            background-color: #ffffff;
            color: #000000;
            transform: translateY(-2px);
        }

        /* --- NOTICE BOX --- */
        #noticeContainer {
            display: none;
            background: linear-gradient(90deg, #12151a 0%, #171b22 100%);
            border-bottom: 1px solid #2c3440;
            padding: 12px 24px;
            position: relative;
            z-index: 90;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .notice-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .notice-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #e2e8f0;
            line-height: 1.4;
        }

        .notice-badge {
            background: #f59e0b;
            color: #000;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .notice-btn {
            background: #3ea6ff;
            color: #000;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 16px;
            text-decoration: none;
            white-space: nowrap;
            transition: 0.2s;
        }

        .notice-btn:hover {
            background: #60b7ff;
            transform: scale(1.04);
        }

        .notice-close {
            background: none;
            border: none;
            color: #8892b0;
            font-size: 20px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }

        .notice-close:hover { color: #fff; }

        /* Grid */
        .video-container {
            padding: 28px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px 18px;
        }

        .video-card {
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.25s ease;
            border-radius: 14px;
            background: #090909;
            padding: 6px;
            border: 1px solid #1a1a1a;
        }

        .video-card:hover {
            transform: translateY(-5px);
            border-color: #333333;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
        }

        .thumbnail-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            overflow: hidden;
            background-color: #121212;
        }

        .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            display: block;
            transition: transform 0.3s ease;
        }

        .video-card:hover .thumbnail-box img {
            transform: scale(1.04);
        }

        .type-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 11px;
            padding: 4px 9px;
            border-radius: 6px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .video-details {
            padding: 10px 4px 6px 4px;
        }

        .video-details h3 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.45;
            color: #f5f5f5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            letter-spacing: -0.2px;
        }

        #loading, #noResults {
            text-align: center;
            padding: 60px 20px;
            font-size: 16px;
            color: #777;
            width: 100%;
            grid-column: 1 / -1;
        }

        /* Episodes Modal */
        .series-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .series-content {
            background: #0f0f10;
            border: 1px solid #282828;
            border-radius: 16px;
            width: 100%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 26px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px; right: 20px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 28px;
            cursor: pointer;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            padding-right: 30px;
            color: #3ea6ff;
        }

        .season-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
        }

        .season-tab {
            background: #181818;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #333;
            white-space: nowrap;
        }

        .season-tab.active {
            background: #3ea6ff;
            color: #000;
            font-weight: bold;
            border-color: #3ea6ff;
        }

        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .episode-btn {
            background: #181818;
            border: 1px solid #282828;
            color: #fff;
            padding: 12px 10px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .episode-btn:hover {
            background: #ffffff;
            color: #000000;
            transform: translateY(-2px);
        }

        @media (max-width: 650px) {
            header { padding: 12px 16px; justify-content: center; }
            .video-container { grid-template-columns: 1fr; padding: 14px; }
            .notice-inner { flex-direction: column; align-items: flex-start; gap: 8px; }
            .notice-close { position: absolute; right: 12px; top: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search movies or series...">
            <button>🔍</button>
        </div>

        <nav class="dashboard-nav">
            <a href="#" id="linkInsta" target="_blank" class="nav-link">Instagram</a>
            <a href="#" id="linkTele" target="_blank" class="nav-link">Telegram</a>
            <a href="#" id="linkContact" class="nav-link">Contact Us</a>
        </nav>
    </header>

    <!-- LIVE NOTICE BOX -->
    <div id="noticeContainer">
        <div class="notice-inner">
            <div class="notice-left">
                <span class="notice-badge">NOTICE</span>
                <span id="noticeText">Important Announcement</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <a href="#" id="noticeBtn" target="_blank" class="notice-btn" style="display: none;">Join</a>
                <button class="notice-close" onclick="dismissNotice()">&times;</button>
            </div>
        </div>
    </div>

    <main class="video-container" id="videoGrid">
        <div id="loading">Connecting to database... ⏳</div>
    </main>
    <div id="noResults" style="display: none;">Koi movie ya series nahi mili ❌</div>

    <!-- Episode Modal -->
    <div class="series-modal" id="seriesModal">
        <div class="series-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 class="modal-title" id="modalSeriesTitle">Series Title</h2>
            <div class="season-tabs" id="seasonTabs"></div>
            <div class="episode-grid" id="episodeGrid"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD_ZzAlN5khcrA3Ok2kggWoFY_5JsNPBvY",
            authDomain: "moviehd-5e729.firebaseapp.com",
            databaseURL: "https://moviehd-5e729-default-rtdb.firebaseio.com",
            projectId: "moviehd-5e729",
            storageBucket: "moviehd-5e729.firebasestorage.app",
            messagingSenderId: "581295799094",
            appId: "1:581295799094:web:49675da1bc143532851197",
            measurementId: "G-LEV6KN7JBQ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Notice Box Listener
        db.ref('site_notice').on('value', (snap) => {
            const notice = snap.val();
            const container = document.getElementById('noticeContainer');
            const textEl = document.getElementById('noticeText');
            const btnEl = document.getElementById('noticeBtn');

            if (notice && notice.enabled && notice.message.trim() !== '') {
                textEl.innerText = notice.message;

                if (notice.btnText && notice.btnLink) {
                    btnEl.innerText = notice.btnText;
                    btnEl.href = notice.btnLink;
                    btnEl.style.display = 'inline-block';
                } else {
                    btnEl.style.display = 'none';
                }
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        });

        function dismissNotice() {
            document.getElementById('noticeContainer').style.display = 'none';
        }

        // 2. Algorithm for Unique Card Tags
        const accentPalettes = [
            { tagColor: "#3ea6ff", glow: "rgba(62, 166, 255, 0.4)" },
            { tagColor: "#a855f7", glow: "rgba(168, 85, 247, 0.4)" },
            { tagColor: "#10b981", glow: "rgba(16, 185, 129, 0.4)" },
            { tagColor: "#f59e0b", glow: "rgba(245, 158, 11, 0.4)" },
            { tagColor: "#ef4444", glow: "rgba(239, 68, 68, 0.4)" },
            { tagColor: "#ec4899", glow: "rgba(236, 72, 153, 0.4)" }
        ];

        function getCardAlgorithm(title) {
            let hash = 0;
            for (let i = 0; i < title.length; i++) {
                hash = title.charCodeAt(i) + ((hash << 5) - hash);
            }
            return accentPalettes[Math.abs(hash) % accentPalettes.length];
        }

        // Links
        db.ref('dashboard_links').on('value', (snap) => {
            const data = snap.val();
            if (data) {
                document.getElementById('linkInsta').href = data.insta || '#';
                document.getElementById('linkTele').href = data.tele || '#';
                document.getElementById('linkContact').href = data.contact || '#';
            }
        });

        // Content
        db.ref('movies').on('value', (snap) => {
            const data = snap.val();
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';

            if (!data) {
                grid.innerHTML = '<div id="loading">Abhi koi content upload nahi hai.</div>';
                return;
            }

            Object.keys(data).reverse().forEach(key => {
                const item = data[key];
                const isSeries = item.type === 'series';
                const style = getCardAlgorithm(item.title);

                const card = document.createElement('div');
                card.className = 'video-card';

                card.innerHTML = `
                    <div class="thumbnail-box">
                        <img src="${item.img}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/600x340/111111/444444?text=${encodeURIComponent(item.title)}'">
                        <span class="type-tag" style="color: ${style.tagColor}; border-color: ${style.glow};">
                            ${isSeries ? '📺 SERIES' : '🎬 MOVIE'}
                        </span>
                    </div>
                    <div class="video-details">
                        <h3>${item.title}</h3>
                    </div>
                `;

                card.onclick = () => {
                    if (isSeries) {
                        openSeriesModal(item);
                    } else {
                        window.open(item.link, '_blank');
                    }
                };

                grid.appendChild(card);
            });
        });

        function openSeriesModal(series) {
            document.getElementById('modalSeriesTitle').innerText = series.title;
            const tabs = document.getElementById('seasonTabs');
            const epGrid = document.getElementById('episodeGrid');
            tabs.innerHTML = '';
            epGrid.innerHTML = '';

            const seasons = series.seasons || {};
            const seasonKeys = Object.keys(seasons);

            if (seasonKeys.length === 0) {
                epGrid.innerHTML = '<p style="color:#aaa;">Koi episode nahi mila.</p>';
            } else {
                seasonKeys.forEach((sKey, index) => {
                    const tab = document.createElement('div');
                    tab.className = `season-tab ${index === 0 ? 'active' : ''}`;
                    tab.innerText = seasons[sKey].name || `Season ${sKey}`;
                    tab.onclick = () => {
                        document.querySelectorAll('.season-tab').forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');
                        loadEpisodes(seasons[sKey].episodes);
                    };
                    tabs.appendChild(tab);
                });

                loadEpisodes(seasons[seasonKeys[0]].episodes);
            }

            document.getElementById('seriesModal').style.display = 'flex';
        }

        function loadEpisodes(episodes) {
            const epGrid = document.getElementById('episodeGrid');
            epGrid.innerHTML = '';
            if (!episodes || episodes.length === 0) {
                epGrid.innerHTML = '<p style="color:#aaa;">Is season me koi episode nahi hai.</p>';
                return;
            }

            episodes.forEach(ep => {
                const a = document.createElement('a');
                a.className = 'episode-btn';
                a.href = ep.link;
                a.target = '_blank';
                a.innerHTML = `▶ ${ep.name}`;
                epGrid.appendChild(a);
            });
        }

        function closeModal() {
            document.getElementById('seriesModal').style.display = 'none';
        }

        // Search Filter
        document.getElementById('searchInput').addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.video-card');
            let found = 0;

            cards.forEach(card => {
                const title = card.querySelector('h3').textContent.toLowerCase();
                if (title.includes(query)) {
                    card.style.display = 'block';
                    found++;
                } else {
                    card.style.display = 'none';
                }
            });

            document.getElementById('noResults').style.display = (found === 0 && cards.length > 0) ? 'block' : 'none';
        });
    </script>
</body>
</html>
